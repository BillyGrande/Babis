name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tool pins match the local toolchain (CLAUDE.md, Dev Workflow).
env:
  ZIG_VERSION: 0.17.0
  CARGO_ZIGBUILD_VERSION: 0.24.0
  KIND_VERSION: v0.33.0

jobs:
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: central/go.mod
      - run: make central-check
      - name: generated files are up to date
        run: |
          make generate manifests
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files drift. Run 'make generate manifests' and commit:"
            git status --porcelain
            git diff
            exit 1
          fi

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain from edge/rust-toolchain.toml
        working-directory: edge
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - run: make edge-check
      - name: musl build, size and peak-RSS budget (x86_64)
        run: make edge-budget
      - name: musl build (aarch64)
        run: make build-edge-arm64

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: central/go.mod
      - name: install toolchain from edge/rust-toolchain.toml
        working-directory: edge
        run: rustup show active-toolchain || rustup toolchain install
      - run: make contract

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported ArgoCD minor; keep in sync with test/e2e/run.sh.
        argocd: [v3.5.6, v3.3.18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: central/go.mod
      - name: install toolchain from edge/rust-toolchain.toml
        working-directory: edge
        run: rustup show active-toolchain || rustup toolchain install
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild@${{ env.CARGO_ZIGBUILD_VERSION }}
      - name: install kind
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: kind version && kubectl version --client
      - run: make e2e
        env:
          ARGOCD_VERSIONS: ${{ matrix.argocd }}
