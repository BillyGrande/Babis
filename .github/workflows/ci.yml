name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: central/go.mod
      - run: make central-check

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain from edge/rust-toolchain.toml
        working-directory: edge
        run: rustup show active-toolchain || rustup toolchain install
      - run: make edge-check
