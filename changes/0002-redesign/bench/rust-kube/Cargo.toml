[package]
name = "kubebench"
version = "0.1.0"
edition = "2021"

[dependencies]
kube = { version = "=4.2.0", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "=0.28.0", default-features = false, features = ["latest"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "macros"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
