[package]
name = "babis"
version = "0.0.0"
edition = "2024"

[dependencies]
lexopt = "0.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tiny_http = "0.12.0"
