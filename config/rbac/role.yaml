---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edge-deployer-operator
rules:
- apiGroups:
  - fleet.edgedeployer.io
  resources:
  - edges
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - fleet.edgedeployer.io
  resources:
  - edges/status
  verbs:
  - get
  - patch
  - update
