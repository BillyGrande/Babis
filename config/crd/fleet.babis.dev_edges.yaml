---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: edges.fleet.babis.dev
spec:
  group: fleet.babis.dev
  names:
    kind: Edge
    listKind: EdgeList
    plural: edges
    shortNames:
    - edge
    singular: edge
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display
      type: string
    - jsonPath: .status.appsTotal
      name: Apps
      type: integer
    - jsonPath: .status.appsSynced
      name: Synced
      type: integer
    - jsonPath: .status.appsHealthy
      name: Healthy
      type: integer
    - jsonPath: .status.conditions[?(@.type=="Reachable")].status
      name: Reachable
      type: string
    - jsonPath: .status.lastReportTime
      name: Last Report
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Edge is one edge cluster in the fleet: auto-registered by its first
          report, kept fresh by heartbeats, marked unreachable when they stop.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              EdgeSpec is the desired/expected state of one edge cluster. Edges are
              usually auto-registered by their first report; spec fields are operator
              overrides on top of that.
            properties:
              displayName:
                description: DisplayName is a human-friendly name shown in listings.
                type: string
              expectedStoreVersion:
                description: |-
                  ExpectedStoreVersion is the air-gap store version this edge should be
                  running. When set and different from status.storeVersion, the edge is
                  out of date.
                type: string
              heartbeatTimeout:
                description: |-
                  HeartbeatTimeout is how long after the last report the edge is
                  considered unreachable. Defaults to the operator-wide flag.
                type: string
            type: object
          status:
            description: |-
              EdgeStatus is the last observed state, written by the ingest endpoint
              from edge reports and by the reconciler (reachability).
            properties:
              apps:
                description: Apps is the per-Application state from the edge's ArgoCD.
                items:
                  description: AppSummary is the compact per-Application record reported
                    by an edge.
                  properties:
                    health:
                      description: Health is the ArgoCD health status (Healthy, Degraded,
                        Progressing, ...).
                      type: string
                    name:
                      type: string
                    revision:
                      description: Revision is the short revision currently deployed.
                      type: string
                    sync:
                      description: Sync is the ArgoCD sync status (Synced, OutOfSync,
                        Unknown).
                      type: string
                  required:
                  - name
                  type: object
                type: array
              appsHealthy:
                type: integer
              appsSynced:
                type: integer
              appsTotal:
                description: |-
                  AppsTotal / AppsSynced / AppsHealthy summarize Apps for printing and
                  selection without walking the list.
                type: integer
              conditions:
                description: Conditions currently only carries Reachable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              labels:
                additionalProperties:
                  type: string
                description: Labels reported by the edge (site, region, hardware,
                  ...).
                type: object
              lastReportTime:
                description: LastReportTime is when the most recent report was received.
                format: date-time
                type: string
              registryHealthy:
                description: |-
                  RegistryHealthy reports the edge's local OCI registry health, when the
                  edge runs one (air-gapped installs).
                type: boolean
              storeVersion:
                description: StoreVersion is the air-gap store version reported by
                  the edge.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
