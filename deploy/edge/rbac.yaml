apiVersion: v1
kind: ServiceAccount
metadata:
  name: babis-checkin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: babis-checkin
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [in-cluster]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: babis-checkin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: babis-checkin
subjects:
  - kind: ServiceAccount
    name: babis-checkin
